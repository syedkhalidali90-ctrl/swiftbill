/* =====================================================================
   14. CUSTOMER VIEW (same file, opened via #inv= link)
   Read-only invoice + feedback sent back to the shop's WhatsApp.
   ===================================================================== */
async function bootClientView() {
  CLIENT_MODE = true;
  document.body.classList.add('client');
  $('app').classList.add('hidden');
  const cv = $('clientView');
  cv.classList.remove('hidden');

  let p;
  try {
    p = await decodeInvoice(decodeURIComponent(location.hash.slice(5)));
  } catch (e) {
    cv.innerHTML = clientMessage('⚠️', 'Invalid invoice link',
      'This link is damaged or incomplete. Please ask the shop to send the invoice again.');
    return;
  }
  S.shopName = p.s || 'SWIFTBILL POS';
  document.title = `Invoice #${p.n} · ${S.shopName}`;

  const generated = num(p.g) || num(p.d);
  const expiresAt = generated + LINK_TTL_MS;
  if (Date.now() > expiresAt) {
    cv.innerHTML = clientMessage('⏰', 'This invoice link has expired after 3 days',
      `Invoice #${esc(p.n)} from <b>${esc(S.shopName)}</b> was shared on ${esc(fmtDate(generated))}.
       For your security, e-invoice links are only valid for 3 days. Please ask the shop to send a new link.`);
    return;
  }

  const rec = payloadToRecord(p);
  cv.innerHTML = `
    <div class="cv-wrap">
      <div class="cv-top">
        <div class="logo">SB</div>
        <div style="min-width:0">
          <div class="cv-shop">${esc(S.shopName)}</div>
          <div class="cv-sub">Digital invoice · valid until ${esc(fmtDate(expiresAt))}</div>
        </div>
      </div>
      <div class="cv-card">${invoiceHTML(rec)}</div>

      <div class="cv-card">
        <div class="cv-h">Confirm your items</div>
        <p class="muted" style="margin:0 0 12px;font-size:13px">Step 1 — tap one option. Step 2 — add a note (optional). Step 3 — send.</p>
        <div class="fb-opts" role="radiogroup" aria-label="Feedback status">
          <button type="button" class="fb-opt ok" data-fb="ok" role="radio" aria-checked="false">
            <span class="fb-dot" aria-hidden="true"></span>
            <span class="fb-ico" aria-hidden="true">✅</span>
            <span class="fb-txt"><b>Approved</b><small>Items complete — all received</small></span>
          </button>
          <button type="button" class="fb-opt bad" data-fb="issue" role="radio" aria-checked="false">
            <span class="fb-dot" aria-hidden="true"></span>
            <span class="fb-ico" aria-hidden="true">⚠️</span>
            <span class="fb-txt"><b>Issue Found</b><small>Shortage, damage or wrong item</small></span>
          </button>
        </div>
        <label class="fb-label" for="fbNotes">NOTE (OPTIONAL)</label>
        <textarea class="fb-notes" id="fbNotes" maxlength="800" placeholder="e.g. 2 pcs Steel Bolt missing"></textarea>
        <!-- A real link (not window.open) so in-app browsers like WhatsApp's never block it -->
        <a class="btn wa fb-send off" id="fbSend" href="#" rel="noopener" role="button" aria-disabled="true">
          Send Feedback via WhatsApp
        </a>
        <p class="fb-to" id="fbTo">${p.w
          ? 'Will be sent to the shop: <b>+' + esc(p.w) + '</b>'
          : 'The shop has not saved a WhatsApp number — WhatsApp will ask you to choose the chat.'}</p>
        <button class="btn" id="cvPrint" style="width:100%;margin-top:8px">Print / Save as PDF</button>
      </div>
      <p class="center muted" style="font-size:11px">Generated by ${esc(S.shopName)} · SwiftBill POS</p>
    </div>`;

  let choice = null;              // 'ok' | 'issue'
  const sendBtn = $('fbSend');
  const notesEl = $('fbNotes');

  /** WhatsApp message for the current choice + note. */
  const feedbackMessage = () => {
    const notes = notesEl.value.trim();
    return [
      `*Invoice #${p.n} — Customer Feedback*`,
      `Shop: ${S.shopName}`,
      `Customer: ${rec.customerName}`,
      `Invoice date: ${fmtDate(rec.date)}`,
      `Net Payable: ${fmt(rec.net)}`,
      `Status: ${choice === 'ok' ? '✅ APPROVED (items complete)' : '⚠️ ISSUE FOUND (shortage / problem)'}`,
      `Note: ${notes || '—'}`
    ].join('\n');
  };

  /** Keep the send link's href in sync so a tap opens WhatsApp natively. */
  const refreshSend = () => {
    const ready = !!choice;
    sendBtn.classList.toggle('off', !ready);
    sendBtn.setAttribute('aria-disabled', String(!ready));
    sendBtn.href = ready
      ? 'https://wa.me/' + (p.w || '') + '?text=' + encodeURIComponent(feedbackMessage())
      : '#';
    sendBtn.textContent = ready
      ? (choice === 'ok' ? 'Send “Approved” via WhatsApp' : 'Send “Issue Found” via WhatsApp')
      : 'Select Approved or Issue Found first';
  };

  cv.querySelectorAll('[data-fb]').forEach(btn => btn.addEventListener('click', () => {
    choice = btn.dataset.fb;
    cv.querySelectorAll('[data-fb]').forEach(b => {
      b.classList.toggle('sel', b === btn);
      b.setAttribute('aria-checked', String(b === btn));
    });
    refreshSend();
  }));
  notesEl.addEventListener('input', refreshSend);
  sendBtn.addEventListener('click', e => {
    if (!choice) {
      e.preventDefault();
      toast('Please tap Approved or Issue Found first');
      return;
    }
    refreshSend();            // make sure the very latest note is in the link; default navigation opens WhatsApp
  });
  $('cvPrint').onclick = () => printReceipt(rec);
  refreshSend();
}

function clientMessage(icon, title, html) {
  return `
    <div class="cv-wrap">
      <div class="cv-card cv-msg">
        <div class="cv-icon">${icon}</div>
        <h1>${esc(title)}</h1>
        <p>${html}</p>
      </div>
    </div>`;
}

/* =====================================================================
   15. BOOT
   ===================================================================== */
if (location.hash.startsWith('#inv=')) {
  bootClientView();                    // customer opened a shared e-invoice link
} else {
  load();
  save();
  render();
}
// Switching between POS and an invoice link in the same tab → reload into the right mode
window.addEventListener('hashchange', () => {
  if (CLIENT_MODE || location.hash.startsWith('#inv=')) location.reload();
});
</script>
</body>
</html>
